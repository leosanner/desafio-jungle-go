# Extra wagering replicas for the multi-instance runbook (ADR 0020).
#
#   docker compose -f docker-compose.yml -f docker-compose.instances.yml up --build
#
# Host ports: app=8080, app-b=8082, app-c=8083. All three share Compose Postgres,
# Keycloak and LocalStack. Use host binaries (docs/runbooks/multiple-instances.md)
# when you need isolated databases; this overlay is the operator-shaped replica set.

services:
  app-b:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
      MIGRATIONS_PATH: /migrations
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      SQS_WAGER_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_NAME: wager-events.fifo
      FX_START_TIMEOUT: 15s
      FX_STOP_TIMEOUT: 30s
      OUTBOX_POLL_INTERVAL: 250ms
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_LEASE: 30s
      OUTBOX_BACKOFF_MAX: 1m
      SQS_VISIBILITY_TIMEOUT: 30s
      SQS_WAIT_TIME: 20s
      SQS_BACKOFF_MAX: 20s
      PENDING_POLL_INTERVAL: 250ms
      PENDING_BATCH_SIZE: "10"
      PENDING_LEASE: 30s
      PENDING_BACKOFF_MAX: 1m
      PENDING_MAX_ATTEMPTS: "8"
      PENDING_TTL: 5m
      OIDC_ISSUER: http://keycloak:8080/realms/wagering
      OIDC_AUDIENCE: wagering-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_INTERNAL_CLIENT: wagering-internal
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  app-c:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
      MIGRATIONS_PATH: /migrations
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      SQS_WAGER_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_NAME: wager-events.fifo
      FX_START_TIMEOUT: 15s
      FX_STOP_TIMEOUT: 30s
      OUTBOX_POLL_INTERVAL: 250ms
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_LEASE: 30s
      OUTBOX_BACKOFF_MAX: 1m
      SQS_VISIBILITY_TIMEOUT: 30s
      SQS_WAIT_TIME: 20s
      SQS_BACKOFF_MAX: 20s
      PENDING_POLL_INTERVAL: 250ms
      PENDING_BATCH_SIZE: "10"
      PENDING_LEASE: 30s
      PENDING_BACKOFF_MAX: 1m
      PENDING_MAX_ATTEMPTS: "8"
      PENDING_TTL: 5m
      OIDC_ISSUER: http://keycloak:8080/realms/wagering
      OIDC_AUDIENCE: wagering-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_INTERNAL_CLIENT: wagering-internal
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
