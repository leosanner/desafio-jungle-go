# Local stack for Phase 1: PostgreSQL, Keycloak, LocalStack SQS, and the wagering process.
#   docker compose up --build
#
# The app waits for Postgres and LocalStack (queues) to be healthy. Keycloak is started
# with the stack but is unused by the process until authentication (Phase 4).

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  localstack:
    image: localstack/localstack:4.6
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "wager-transactions.fifo"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    # Management/health listens on 9000 inside the container (Keycloak 25+).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
      MIGRATIONS_PATH: /migrations
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      SQS_WAGER_DLQ_NAME: wager-transactions-dlq.fifo
      FX_START_TIMEOUT: 15s
      FX_STOP_TIMEOUT: 30s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
